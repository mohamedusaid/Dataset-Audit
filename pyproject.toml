[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygpt-dataset-audit"
version = "0.3.0"
description = "Streaming, reproducible audits for uint16 GPT token shards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "tiktoken>=0.8,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
tinygpt-audit = "audit_cli:main"

[tool.setuptools]
py-modules = ["audit_cli"]

[tool.setuptools.packages.find]
include = ["audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
